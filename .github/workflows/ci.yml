name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -tags with_utls ./...

      - name: Build
        run: go build -tags with_utls ./...

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -tags with_utls -trimpath -ldflags="-s -w" -o dist/phantom-node-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -tags with_utls -trimpath -ldflags="-s -w" -o dist/phantom-node-linux-arm64 .
          sha256sum dist/phantom-node-linux-amd64 > dist/phantom-node-linux-amd64.sha256
          sha256sum dist/phantom-node-linux-arm64 > dist/phantom-node-linux-arm64.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/phantom-node-linux-amd64
            dist/phantom-node-linux-arm64
            dist/phantom-node-linux-amd64.sha256
            dist/phantom-node-linux-arm64.sha256
