name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Linux binaries
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        goarch:
          - amd64
          - arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -tags with_utls ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -tags with_utls -trimpath -ldflags="-s -w" -o "dist/singbox-bridge-linux-${GOARCH}" .

      - name: Checksum
        working-directory: dist
        run: sha256sum "singbox-bridge-linux-${{ matrix.goarch }}" > "singbox-bridge-linux-${{ matrix.goarch }}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: singbox-bridge-linux-${{ matrix.goarch }}
          path: |
            dist/singbox-bridge-linux-${{ matrix.goarch }}
            dist/singbox-bridge-linux-${{ matrix.goarch }}.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
